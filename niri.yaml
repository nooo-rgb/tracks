impl: 'https://raw.githubusercontent.com/nooo-rgb/tracks/main'
track: 'system'

packages:
  # Session / compositor
  - 'niri'
  - 'sddm'
  - 'seatd'
  - 'uwsm'
  - 'xwayland-satellite'

  # Requested applications
  - 'plymouth'
  - 'rio'
  - 'starship'
  - 'yazi'
  - 'chafa'

  # Niri / Wayland desktop support
  - 'xdg-desktop-portal'
  - 'xdg-desktop-portal-gtk'
  - 'xdg-desktop-portal-gnome'
  - 'gnome-keyring'
  - 'swaybg'
  - 'wl-clipboard'
  - 'polkit-gnome'
  - 'qt5-wayland'
  - 'qt6-wayland'
  - 'adwaita-fonts'
  - 'ttf-nerd-fonts-symbols'

  # Yazi optional preview/search helpers
  - '7zip'
  - 'fd'
  - 'ffmpeg'
  - 'fzf'
  - 'imagemagick'
  - 'jq'
  - 'poppler'
  - 'resvg'
  - 'ripgrep'
  - 'zoxide'

  # Vicinae runtime/support stack
  - 'qt6-base'
  - 'qt6-declarative'
  - 'qt6-svg'
  - 'qt6-tools'
  - 'qt6-5compat'
  - 'kio'
  - 'layer-shell-qt'
  - 'qt6-keychain'
  - 'libqalculate'
  - 'protobuf'
  - 'cmark'
  - 'minizip'
  - 'rapidfuzz-cpp'
  - 'nodejs'

  # Zsh user shell stack
  - 'zsh'
  - 'zsh-completions'

  # DankMaterialShell / Dank Linux Shell for Niri
  - 'dms-shell-niri'
  - 'dms-shell'
  - 'quickshell'
  - 'accountsservice'
  - 'dgop'
  - 'cliphist'
  - 'matugen'
  - 'qt6-multimedia'
  - 'qt6ct'
  - 'wtype'
  - 'cava'
  - 'i2c-tools'
  - 'cups-pk-helper'

aur-packages:
  - 'vicinae-bin'
  - 'dsearch-bin'

services:
  - 'sddm'
  - 'seatd'
