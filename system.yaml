services:
  - 'cups'
  - 'bluetooth'
  - 'NetworkManager'
  - 'power-profiles-daemon'
  - 'fprintd'

user-services:
  - 'blend-files'

commands:
  - 'chsh -s /bin/zsh root || true'
  - 'sed -i "s|^SHELL=.*|SHELL=/bin/zsh|" /etc/default/useradd || true'
