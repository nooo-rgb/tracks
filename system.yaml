repo: 'https://pkg-repo.blendos.co'
arch-repo: 'https://geo.mirror.pkgbuild.com'
impl: 'https://raw.githubusercontent.com/nooo-rgb/tracks/main'
track: 'custom'

package-repos:
  - name: 'cachyos-v3'
    repo-url: 'https://mirror.cachyos.org/repo/x86_64_v3/$repo'
  - name: 'cachyos-core-v3'
    repo-url: 'https://mirror.cachyos.org/repo/x86_64_v3/$repo'
  - name: 'cachyos-extra-v3'
    repo-url: 'https://mirror.cachyos.org/repo/x86_64_v3/$repo'
  - name: 'cachyos'
    repo-url: 'https://mirror.cachyos.org/repo/$arch/$repo'

